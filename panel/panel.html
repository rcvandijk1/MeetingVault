<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kantlijn</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <h1>Kantlijn</h1>
    <a id="settings" href="../options/options.html" target="_blank" rel="noopener">Instellingen</a>
  </header>

  <section id="site" class="card" aria-live="polite"></section>

  <section id="actions" class="actions" hidden>
    <button id="btn-article" class="primary" type="button">Analyseer dit artikel</button>
    <button id="btn-select" type="button">Kies een artikel op de pagina</button>
    <button id="btn-selection" type="button">Analyseer geselecteerde tekst</button>
  </section>

  <p id="status" class="status" role="status" hidden></p>

  <main id="result" hidden>
    <section class="card">
      <p id="art-source" class="meta"></p>
      <h2 id="art-title"></h2>
      <div id="band" class="band"></div>
      <p id="engine" class="meta engine"></p>
      <ul id="notes" class="notes"></ul>
    </section>

    <section>
      <h3>Gevonden technieken</h3>
      <div id="findings"></div>
    </section>

    <section id="missing-section" hidden>
      <h3>Wat ontbreekt volgens het model</h3>
      <ul id="missing" class="card missing"></ul>
    </section>

    <section>
      <h3>Wie brengt dit nieuws ook?</h3>
      <div id="coverage" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>Kantlijn controleert geen feiten. Het laat zien hoe een tekst je stuurt, niet of de inhoud waar is. Lees de citaten en oordeel zelf.</p>
    <p id="privacy"></p>
  </footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
