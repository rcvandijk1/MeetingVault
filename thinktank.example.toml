# Copy to thinktank.toml (or point THINKTANK_CONFIG at it). Every key is optional.
# Environment variables THINKTANK_<KEY> override these, e.g. THINKTANK_RUN_WINDOW="22:00-07:00".

# Display name: browser tab, notifications, reply headers.
system_name = "Nightwatch"

db_path = "thinktank.sqlite3"
claude_bin = "claude"

# "subscription": runs draw on the logged-in Claude plan (ANTHROPIC_API_KEY is stripped).
# "api_key": requires ANTHROPIC_API_KEY; set a Console spend limit as the outer guard.
auth_mode = "subscription"

# Section 6: tiers, not names. Aliases resolve to the latest model in the CLI.
# Planning (thinker/lead) and writing (synthesizer) get the top model; reading
# is volume and stays cheap; verification is mechanical judgement and stays mid.
# Fable costs twice Opus per token; the lead and synthesizer run once per problem.
[models]
reader = "haiku"
thinker = "fable"
critic = "sonnet"
synthesizer = "fable"
judge = "sonnet"

# Ideas mode overrides: the premortem is judgement, not checking.
[models_ideas]
critic = "opus"

# If the primary model is unavailable or refuses, the CLI continues on this one.
[fallback_models]
thinker = "opus"
synthesizer = "opus"
critic = "opus"
reader = "sonnet"
judge = "opus"

# How hard each role thinks: low | medium | high | xhigh | max. Empty = CLI default.
[effort]
reader = "medium"
thinker = "high"
critic = "medium"
synthesizer = "high"
judge = "medium"

[effort_ideas]
critic = "high"

# Section 9: no hard limit on subscription spend. The board shows 7-day and
# 30-day API-equivalent spend against this figure (the plan's monthly price).
# spend_max_usd_month = 100.0
# Guard against one runaway agent, not against total spend. 0 disables it.
# max_usd_per_run = 8.0
# run_timeout_seconds = 1800
# max_concurrent_agents = 3
# idea_thinkers = 3

# Message board. A thread closes when its token budget is spent; no reply limit.
# thread_token_budget = 200000
# max_topic_matches = 2
# Where each agent's working directory and Claude Code session live until its problem closes.
# agent_dir = "agents"

# Only start problems in your off-hours (local time). Empty = any time.
# run_window = "22:00-07:00"
# poll_seconds = 30
# rate_limit_pause_seconds = 1800

# Board. Loopback by default; bind to your private network address to reach it from a phone.
# web_host = "127.0.0.1"
# web_port = 8765
# Optional TLS (PEM paths). Desktop notifications in the browser need https or
# localhost; the tab badge works either way. Tailscale Serve is the easier route.
# web_tls_cert = ""
# web_tls_key = ""
# The daemon writes a heartbeat this often; the board reports it dead after three misses.
# heartbeat_seconds = 30

# Section 8 expiry defaults, in days. Historical facts never expire.
# [claim_expiry_days]
# price = 182
# market_size = 182
# capability = 365
# company_fact = 730
# other = 365
